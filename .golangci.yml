# golangci-lint configuration (v2)
# https://golangci-lint.run/product/config-file/

version: "2"

run:
  timeout: 5m
  go: "1.25"

linters:
  enable:
    # Safety and correctness
    - govet
    - staticcheck
    - errcheck
    
    # Code quality
    - ineffassign
    - gosimple
    - unused
    - misspell
    
    # Documentation
    - revive
  disable:
    - exhaustivestruct
    - exhaustive
    - varnamelen
    - interfacer

formatters:
  enable:
    - gofmt
    - goimports
